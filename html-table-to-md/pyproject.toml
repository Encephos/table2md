[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "table2md"
version = "0.1.0"
description = "Extracts HTML tables and converts them to Markdown, preserving structure via row/colspan handling."
readme = "README.md"
authors = [{ name = "Encephos", email = "encephos@gmail.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12.0",  # Schnellerer Parser
    "lxml>=4.9.0",
    "pytest>=8.4.2",
]

[project.urls]
"Homepage" = "https://github.com/Encephos/html-table-rescuer"
